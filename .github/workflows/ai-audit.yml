# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: AI Project Audit

on:
  push:
    branches: ["main", "develop"]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (if needed)
        run: |
          if [ -f package.json ]; then
            npm install
          else
            echo "No package.json found, skipping install"
          fi

      - name: Debug info
        run: |
          echo "Node version:"
          node -v
          echo "NPM version:"
          npm -v
          echo "📂 Current directory:"
          pwd
          echo "📁 Listing .ai structure:"
          ls -R .ai || true

      - name: Validate AI structure
        run: |
          ROOT_DIR=$(pwd)

          if [ ! -f "$ROOT_DIR/.ai/audit/audit-system.md" ]; then
            echo "❌ Missing audit-system.md"
            exit 1
          fi

          if [ ! -f "$ROOT_DIR/.ai/audit/audit-prompt.md" ]; then
            echo "❌ Missing audit-prompt.md"
            exit 1
          fi

          if [ ! -f "$ROOT_DIR/.ai/core/audit-agent.md" ]; then
            echo "❌ Missing audit-agent.md"
            exit 1
          fi

          echo "✅ Core audit files present"

      - name: Run AI Audit (Punto B)
        run: |
          node scripts/ai-audit.js

      - name: Success
        run: echo "🎯 AI Audit Passed"